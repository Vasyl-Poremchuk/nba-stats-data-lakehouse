[project]
name = "nba-stats-data-lakehouse"
version = "0.1.0"
description = "A set of Glue jobs that use already collected NBA data to create a data lakehouse on AWS using the Medallion architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.1.0",
    "boto3>=1.38.18",
    "pyspark>=3.5.5",
    "ruff>=0.11.10",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
]

line-length = 79
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and as subset of the pycodestyle (`E`) codes by default.
select = ["E4", "E5", "E7", "E9", "F", "W"]
ignore = []

pycodestyle.max-doc-length = 72

# Allow to fix all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
docstring-code-format = true

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
